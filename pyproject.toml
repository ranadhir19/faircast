[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faircast"
version = "0.1.0"
description = "Fairness-breach forecasting under natural drift: calibrated breach probabilities, FAR-designed alarms, and a drift-budget certificate — with self-benchmarking that prints NO-SKILL when the forecaster has none."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ranadhir Ghosh" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]
keywords = ["fairness", "forecasting", "drift", "breach", "calibration", "conformal", "responsible-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
faircast = "faircast.cli:main"

[project.urls]
Homepage = "https://github.com/ranadhir19/faircast"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
faircast = ["data/*.csv"]
